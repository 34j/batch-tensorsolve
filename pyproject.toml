[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77.0.3" ]

[project]
name = "batch-tensorsolve"
version = "1.0.2"
description = "Batched tensorsolve() for NumPy / PyTorch / JAX"
readme = "README.md"
license = "MIT"
authors = [
  { name = "34j" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "array-api-compat>=1.11.2",
  "array-api-extra>=0.7.2",
  "types-array-api>=1.1.4",
]
urls."Bug Tracker" = "https://github.com/34j/batch-tensorsolve/issues"
urls.Changelog = "https://github.com/34j/batch-tensorsolve/blob/main/CHANGELOG.md"
urls.documentation = "https://batch-tensorsolve.readthedocs.io"
urls.repository = "https://github.com/34j/batch-tensorsolve"

[dependency-groups]
dev = [
  "numpy>=2.3.4",
  "packaging-34j[test]",
]
docs = [
  "packaging-34j[docs]",
]

[tool.ruff]
extend = ".venv/ruff.toml"
lint.per-file-ignores."src/batch_tensorsolve/_main.py" = [ "DOC502" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.ty]
terminal.error-on-warning = true
